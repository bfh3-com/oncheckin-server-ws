services:
  server:
    build:
      context: .
    environment:
      NODE_ENV: production
    networks:
      - tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - tunnel
networks:
  tunnel:
    driver: bridge
